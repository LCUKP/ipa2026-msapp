name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Lint & Format Tools
        run: python -m pip install flake8==7.1.2 black==24.8.0

      - name: Run flake8 (Lint)
        run: flake8 .

      - name: Check code format with black
        run: black --check .

      - name: Check Docker versions
        run: |
          docker --version
          docker compose version

      - name: Build Docker images
        run: |
          docker build -t ipa2026-worker:ci ./worker
          docker build -t ipa2026-scheduler:ci ./scheduler
          docker build -t ipa2026-web:ci ./web

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker tag ipa2026-worker:ci "$DOCKERHUB_USERNAME/worker:latest"
          docker tag ipa2026-scheduler:ci "$DOCKERHUB_USERNAME/scheduler:latest"
          docker tag ipa2026-web:ci "$DOCKERHUB_USERNAME/web:latest"

          docker push "$DOCKERHUB_USERNAME/worker:latest"
          docker push "$DOCKERHUB_USERNAME/scheduler:latest"
          docker push "$DOCKERHUB_USERNAME/web:latest"
